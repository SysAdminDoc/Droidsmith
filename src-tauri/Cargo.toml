[package]
name = "droidsmith"
version = "0.9.17"
description = "Cross-platform open-source GUI for managing Android devices over ADB"
authors = ["Droidsmith contributors"]
license = "MIT"
repository = "https://github.com/SysAdminDoc/Droidsmith"
edition = "2021"
# MSRV floor. Raised from 1.81 to 1.90 for the native toolchain APIs and
# dependency floors used by the command boundary. `rust-toolchain.toml` pins
# the toolchain used for builds; this is the lowest version the crate claims to
# support and the version checked by clippy's `incompatible_msrv` lint.
rust-version = "1.90"
# The crate ships several helper binaries (CLI, linters, bindings generator).
# Pin the GUI binary as the default so `cargo run` / `tauri dev` launch the app.
default-run = "droidsmith"

[lib]
name = "droidsmith_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = ["isolation"] }
serde_json = "1"

[dependencies]
# Floor is 2.11.1, not "2": CVE-2026-42184 / GHSA-7gmj-67g7-phm9 let a remote
# page match the `app://` custom protocol on Windows (`is_local_url` used
# `split_once('.')`, so `http://app.evil.com` passed) and invoke local-only IPC
# commands. Droidsmith exposes privileged device-mutation commands over that
# boundary, so the fixed version is a hard requirement rather than whatever the
# lockfile happens to resolve. `scripts/check-release-policy.mjs` asserts it.
tauri = { version = "2.11.1", features = ["isolation"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Re-reviewed 2026-08-08 against serde-saphyr 1.0.1. Keep serde_yaml_ng for
# this release: every accepted pack, quirk, and profile fixture currently
# parses through its 0.10 API, while serde-saphyr does not publish an MSRV and
# changes the parser/error surface. A migration needs a fixture-by-fixture
# compatibility pass and a reviewed dependency graph, not a drive-by bump.
serde_yaml_ng = "0.10"
# Pinned for graph hygiene, not for the Rust floor: schemars 1.2.2 pulls
# syn 3 and serde_derive_internals 0.30 alongside the versions already in the
# tree, adding two entries to the reviewed duplicate graph in
# `release-policy.json` for no functional gain.
schemars = { version = "=1.2.1", features = ["preserve_order"] }
sha2 = "0.10"
# The specta stack stays `=`-pinned, but no longer because of the Rust floor:
# tauri-specta, specta, and specta-typescript are lock-step prereleases whose
# combined exporter output is what `src/lib/bindings.ts` is checked against
# byte-for-byte by `npm run bindings:check`. rc.25 is a breaking rewrite of the
# type layer (`Type::inline` -> `Type::definition`, `TypeCollection` -> `Types`,
# no `Typescript::bigint`, no `Builder::export_str`), so moving is a reviewed
# migration of the whole IPC surface, not a version bump. It buys nothing on
# its own: `paste` (RUSTSEC-2024-0436) is still a specta dependency at rc.25, so
# upgrading does not retire that suppression either.
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["typescript"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
which = "8"
os_info = "3"
base64 = "0.22.1"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
x509-parser = { version = "=0.18.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# Win32_Foundation + Win32_System_IO back the journal's LockFileEx/UnlockFileEx
# cross-process advisory lock (HANDLE/BOOL and OVERLAPPED respectively).
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"

[[bin]]
name = "droidsmith"
path = "src/main.rs"

[[bin]]
name = "droidsmith-pack-lint"
path = "src/bin/pack_lint.rs"

[[bin]]
name = "droidsmith-schema-lint"
path = "src/bin/schema_lint.rs"

[[bin]]
name = "droidsmith-cli"
path = "src/bin/droidsmith_cli.rs"

[[bin]]
name = "droidsmith-mcp"
path = "src/bin/droidsmith_mcp.rs"

[[bin]]
name = "droidsmith-bindings"
path = "src/bin/generate_bindings.rs"

[[bin]]
name = "droidsmith-upgrade-check"
path = "src/bin/upgrade_check.rs"

[[test]]
name = "fake_tool_contract"
path = "tests/fake_tool_contract.rs"
harness = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[lints.rust]
unsafe_code = "deny"  # `deny` (not `forbid`) so a single well-documented FFI
                       # call in diagnostics.rs can carry an #[allow] override.

[lints.clippy]
all = { level = "warn", priority = -1 }
# clippy::pedantic stays off until v0.1; re-enable selectively as the
# codebase matures.
