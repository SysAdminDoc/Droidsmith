version: "1"
quirks:
  - id: coloros-16-shelf-widget-loss
    title: "ColorOS 16: removing Shelf also removes its third-party widgets"
    matches:
      manufacturer: ["OPPO"]
      rom: ["oppo/"]
      package_id: ["com.coloros.assistantscreen"]
    explanation: |
      Evidence basis: the pinned public UAD-NG package record reports that
      ColorOS 16 loses access to Shelf's third-party widget surface when this
      package is removed. Normal launcher widgets are a separate system.

      Observed on: OPPO ColorOS 16. Other ColorOS versions, Realme UI, and
      OxygenOS remain Unknown rather than inheriting the claim.
    mitigation:
      kind: documentation
      url: "https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation/blob/ef94066d650f2169a62b3b4f886b8ddbeb7b360f/resources/assets/uad_lists.json"
      note: "Keep Shelf if its dedicated widgets are part of your workflow."
