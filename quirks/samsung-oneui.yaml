version: "1"
quirks:
  - id: oneui-wallpaper-manager-removal
    title: "One UI: removing Samsung Wallpapers can block wallpaper changes"
    matches:
      manufacturer: ["Samsung"]
      rom: ["samsung/"]
      package_id: ["com.samsung.android.app.dressroom"]
    explanation: |
      Evidence basis: the pinned public UAD-NG package record reports that
      removal prevents wallpaper changes on Android 10+ and Material You
      palette changes on Android 12+.

      Observed on: Samsung One UI builds carrying this exact package. The
      source does not establish the behavior for AOSP wallpaper providers or
      another OEM, which remain Unknown.
    mitigation:
      kind: documentation
      url: "https://github.com/Universal-Debloater-Alliance/universal-android-debloater-next-generation/blob/ef94066d650f2169a62b3b4f886b8ddbeb7b360f/resources/assets/uad_lists.json"
      note: "Keep Samsung Wallpapers if wallpaper or Material You customization is required."
